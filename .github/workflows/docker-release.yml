name: Docker Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/docker-release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump after this release"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          VERSION=$(grep -oP '^VERSION = "\K[0-9]+\.[0-9]+\.[0-9]+' app/app.py)
          if [ -z "$VERSION" ]; then
            echo "Could not find a VERSION = \"n.n.n\" line in app/app.py" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Bump version for next release
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.version.outputs.version }}"
          bump="${{ github.event.inputs.bump }}"
          bump="${bump:-patch}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          NEW_VERSION="$major.$minor.$patch"
          sed -i "s/^VERSION = \".*\"/VERSION = \"$NEW_VERSION\"/" app/app.py
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app.py
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push
